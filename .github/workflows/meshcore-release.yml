# MeshCore manual release build (Retia, all in-tree boards).
#
# Thin dispatch wrapper around the reusable meshcore-build.yml. Dispatch this on
# the branch you want to release (usually retia-badge). Publishes a PRERELEASE
# (= untested); after hardware verification run "MeshCore Promote" to flip a
# target to a full release (= verified). Verification is PER-TARGET.
#
# Boards + asset names live in meshcore-build.yml (one source of truth). The
# scheduled meshcore-upstream-sync.yml calls the same reusable workflow.
name: MeshCore Release Build

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Extra release notes (what changed / why this build)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: meshcore-release
  cancel-in-progress: false

jobs:
  build-and-publish:
    uses: ./.github/workflows/meshcore-build.yml
    with:
      ref: ${{ github.ref_name }}
      notes: ${{ inputs.notes }}
    secrets: inherit
