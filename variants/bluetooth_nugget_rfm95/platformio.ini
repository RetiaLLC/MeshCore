; Retia Bluetooth Nugget (HakCat / LOLIN S3 Mini, ESP32-S3 4MB / 2MB PSRAM)
; + RFM95W (SX1276) LoRa backpack.
;   Radio : DIO0-only SX1276 on a dedicated SPI bus (SCK6 MISO7 MOSI8 NSS9 RST4 DIO0=16)
;   OLED  : SSD1306 128x64 on I2C (SDA35 SCL36), mounted UPSIDE-DOWN -> DISPLAY_ROTATION=2
;   LEDs  : 3x WS2812 message-notify on GPIO10; status LED on GPIO15
;   Btns  : A44 B43 U13 D18 L11 R12 (active-low, pull-up); user btn = B (43)
; Pinout ref: meshtastic-firmware variants/esp32s3/nugget_s3_lora (USE_RF95 + DISPLAY_FLIP_SCREEN)
[bluetooth_nugget_rfm95_base]
extends = esp32_base
board = esp32-s3-zero
build_flags =
  ${esp32_base.build_flags}
  -I variants/bluetooth_nugget_rfm95
  -D BLUETOOTH_NUGGET_RFM95
  ; --- RFM95W / SX1276 (only DIO0 routed) ---
  -D RADIO_CLASS=CustomSX1276
  -D WRAPPER_CLASS=CustomSX1276Wrapper
  -D SX127X_CURRENT_LIMIT=120
  -D LORA_TX_POWER=20
  -D P_LORA_NSS=9
  -D P_LORA_SCLK=6
  -D P_LORA_MISO=7
  -D P_LORA_MOSI=8
  -D P_LORA_DIO_0=16
  -D P_LORA_DIO_1=0xFFFFFFFF    ; RADIOLIB_NC — DIO1 not wired on the backpack
  -D P_LORA_RESET=4
  ; --- SSD1306 OLED (flipped) ---
  -D PIN_BOARD_SDA=35
  -D PIN_BOARD_SCL=36
  -D DISPLAY_ROTATION=2         ; screen is mounted upside-down (180°)
  ; --- board I/O ---
  -D PIN_USER_BTN=43            ; B button, active-low, internal pull-up
  -D PIN_STATUS_LED=15
  ; --- message notify: 3x WS2812 on GPIO10 ---
  -D NEOPIXEL_NOTIFY_PIN=10
  -D NEOPIXEL_NUM=3
  ; --- US 915 preset; matches the Retia DEF CON badge so the two interoperate.
  ;     duplicate -D: later definition wins over esp32_base's EU default ---
  -D LORA_FREQ=910.525
  -D LORA_BW=62.5
  -D LORA_SF=7
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/bluetooth_nugget_rfm95>
lib_deps =
  ${esp32_base.lib_deps}
  adafruit/Adafruit SSD1306 @ ^2.5.13
  adafruit/Adafruit NeoPixel @ ^1.12.3

; --- flagship: BLE companion (pairs with the MeshCore phone app), OLED status ---
[env:bluetooth_nugget_rfm95_companion_radio_ble]
extends = bluetooth_nugget_rfm95_base
build_flags =
  ${bluetooth_nugget_rfm95_base.build_flags}
  -I examples/companion_radio/ui-new
  -D DISPLAY_CLASS=SSD1306Display
  -D MAX_CONTACTS=300
  -D MAX_GROUP_CHANNELS=8
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
build_src_filter = ${bluetooth_nugget_rfm95_base.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/ui/GenericNeoPixel.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${bluetooth_nugget_rfm95_base.lib_deps}
  densaugeo/base64 @ ~1.4.0

; --- USB companion (bench verification via meshcore-cli). TinyUSB-OTG so the
;     host's DTR-on-open doesn't reset the chip. ---
[env:bluetooth_nugget_rfm95_companion_radio_usb]
extends = bluetooth_nugget_rfm95_base
board = esp32-s3-zero-otg
build_flags =
  ${bluetooth_nugget_rfm95_base.build_flags}
  -I examples/companion_radio/ui-new
  -D DISPLAY_CLASS=SSD1306Display
  -D MAX_CONTACTS=300
  -D MAX_GROUP_CHANNELS=8
  -D OFFLINE_QUEUE_SIZE=256
build_src_filter = ${bluetooth_nugget_rfm95_base.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/ui/GenericNeoPixel.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${bluetooth_nugget_rfm95_base.lib_deps}
  densaugeo/base64 @ ~1.4.0

; --- headless repeater (no UITask/notify) ---
[env:bluetooth_nugget_rfm95_repeater]
extends = bluetooth_nugget_rfm95_base
build_flags =
  ${bluetooth_nugget_rfm95_base.build_flags}
  -D ADVERT_NAME='"Nugget Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
build_src_filter = ${bluetooth_nugget_rfm95_base.build_src_filter}
  +<../examples/simple_repeater>
lib_deps =
  ${bluetooth_nugget_rfm95_base.lib_deps}
  ${esp32_ota.lib_deps}
