; Retia Newsheen — ESP32-S3 Pusheen Puck (esp32_base_puck_v2, N16R2 16MB).
; Seeed Wio-SX1262 LoRa, 8x WS2812B message-notify NeoPixels, optional piezo.
; Screenless: DISPLAY_CLASS=HeadlessDisplayDriver runs the companion UITask (and
; its message NeoPixel/buzzer notify) with no OLED.
[newsheen_base]
extends = esp32_base
board = newsheen
board_build.partitions = default_16MB.csv
build_flags =
  ${esp32_base.build_flags}
  -I variants/newsheen
  -D NEWSHEEN
  ; --- Seeed Wio-SX1262 (RXEN=RF_SW pin, DIO2->TXEN internal) ---
  -D P_LORA_NSS=10
  -D P_LORA_SCLK=13
  -D P_LORA_MISO=12
  -D P_LORA_MOSI=11
  -D P_LORA_DIO_1=21
  -D P_LORA_RESET=9
  -D P_LORA_BUSY=47
  -D SX126X_RXEN=14
  -D SX126X_TXEN=RADIOLIB_NC
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  ; --- board I/O ---
  -D PIN_USER_BTN=17
  -D PIN_STATUS_LED=48
  -D PIN_BOARD_SDA=35
  -D PIN_BOARD_SCL=36
  ; --- message notify: 8 WS2812B on GPIO16 + optional piezo on GPIO15 ---
  -D PIN_NEOPIXEL=16
  -D NEOPIXEL_NUM=8
  -D PIN_BUZZER=15
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/newsheen>
lib_deps =
  ${esp32_base.lib_deps}
  adafruit/Adafruit NeoPixel @ ^1.12.3
  end2endzone/NonBlockingRTTTL @ ^1.3.0

[env:newsheen_companion_radio_ble]
extends = newsheen_base
build_flags =
  ${newsheen_base.build_flags}
  -I examples/companion_radio/ui-new
  -D DISPLAY_CLASS=HeadlessDisplayDriver
  -D MAX_CONTACTS=300
  -D MAX_GROUP_CHANNELS=8
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
build_src_filter = ${newsheen_base.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/ui/buzzer.cpp>
  +<helpers/ui/GenericNeoPixel.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${newsheen_base.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:newsheen_companion_radio_usb]
extends = newsheen_base
; TinyUSB-OTG so the browser's DTR-on-open doesn't reset the chip (USB client path).
board = newsheen-otg
build_flags =
  ${newsheen_base.build_flags}
  -I examples/companion_radio/ui-new
  -D DISPLAY_CLASS=HeadlessDisplayDriver
  -D MAX_CONTACTS=300
  -D MAX_GROUP_CHANNELS=8
  -D OFFLINE_QUEUE_SIZE=256
build_src_filter = ${newsheen_base.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/ui/buzzer.cpp>
  +<helpers/ui/GenericNeoPixel.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${newsheen_base.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:newsheen_repeater]
extends = newsheen_base
build_flags =
  ${newsheen_base.build_flags}
  -D ADVERT_NAME='"Newsheen Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
build_src_filter = ${newsheen_base.build_src_filter}
  +<helpers/ui/buzzer.cpp>
  +<helpers/ui/GenericNeoPixel.cpp>
  +<../examples/simple_repeater>
lib_deps =
  ${newsheen_base.lib_deps}
  ${esp32_ota.lib_deps}
