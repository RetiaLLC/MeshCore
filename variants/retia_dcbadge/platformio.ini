; Retia 2024 DEF CON badge (RetiaLLC/DefconBadge2026)
; ESP32-S3-WROOM-1 (8MB flash, 2MB QSPI PSRAM), RFM95W (SX1276, DIO0 only),
; ILI9341 240x320 TFT + XPT2046 touch + SD + LoRa all on ONE shared SPI bus.
; Hardware reference: https://github.com/RetiaLLC/DefconBadge2026 docs/pinout.md

[Retia_DCBadge]
extends = esp32_base
board = retia-defcon-badge
build_flags =
  ${esp32_base.build_flags}
  -I variants/retia_dcbadge
  -D RETIA_DCBADGE
  -D RADIO_CLASS=CustomSX1276
  -D WRAPPER_CLASS=CustomSX1276Wrapper
  -D SX127X_CURRENT_LIMIT=120
  -D LORA_TX_POWER=20
  -D P_LORA_DIO_0=21
  -D P_LORA_DIO_1=0xFFFFFFFF    ; RADIOLIB_NC — not routed on this badge
  -D P_LORA_NSS=48
  -D P_LORA_RESET=38
  -D P_LORA_SCLK=13
  -D P_LORA_MISO=12
  -D P_LORA_MOSI=11
  -D PIN_USER_BTN=8             ; button A (SW8), active low, external pull-up
  -D PIN_BOARD_SDA=35           ; SAO / QWIIC
  -D PIN_BOARD_SCL=36
  ; US 915 defaults (base config is EU); duplicate -D: later definition wins
  -D LORA_FREQ=910.525
  -D LORA_BW=62.5
  -D LORA_SF=7
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/retia_dcbadge>
lib_deps =
  ${esp32_base.lib_deps}

; --- color TFT + touch add-on (shared by the display-enabled envs) ---
[Retia_DCBadge_tft]
extends = Retia_DCBadge
build_flags =
  ${Retia_DCBadge.build_flags}
  -D DISPLAY_CLASS=ILI9341LCDDisplay
  -D DISPLAY_ROTATION=3         ; landscape, buttons at the bottom
  -D PIN_TFT_CS=47
  -D PIN_TFT_DC=40
  -D PIN_TFT_RST=41
  -D PIN_TFT_LEDA_CTL=-1        ; backlight hardwired to 3.3V on the badge
  -D PIN_BUZZER=9               ; piezo, ~4 kHz resonance
  -D KEEP_DISPLAY_ON_USB=1      ; LCD + hardwired backlight: keep UI on while powered
build_src_filter = ${Retia_DCBadge.build_src_filter}
  +<helpers/ui/ILI9341LCDDisplay.cpp>
  +<helpers/ui/buzzer.cpp>
lib_deps =
  ${Retia_DCBadge.lib_deps}
  adafruit/Adafruit ILI9341 @ ^1.6.1
  adafruit/Adafruit GFX Library @ ^1.11.11
  end2endzone/NonBlockingRTTTL@^1.3.0

; --- bring-up only: headless USB companion (not for release) ---
[env:Retia_DCBadge_bringup_usb]
extends = Retia_DCBadge
build_flags =
  ${Retia_DCBadge.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
build_src_filter = ${Retia_DCBadge.build_src_filter}
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${Retia_DCBadge.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:Retia_DCBadge_companion_radio_usb]
extends = Retia_DCBadge_tft
build_flags =
  ${Retia_DCBadge_tft.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
build_src_filter = ${Retia_DCBadge_tft.build_src_filter}
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${Retia_DCBadge_tft.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:Retia_DCBadge_companion_radio_ble]
extends = Retia_DCBadge_tft
build_flags =
  ${Retia_DCBadge_tft.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456        ; display present => random per-session PIN shown on screen
  -D BLE_DEBUG_LOGGING=1
  -D OFFLINE_QUEUE_SIZE=256
build_src_filter = ${Retia_DCBadge_tft.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${Retia_DCBadge_tft.lib_deps}
  densaugeo/base64 @ ~1.4.0

[env:Retia_DCBadge_repeater]
extends = Retia_DCBadge
build_flags =
  ${Retia_DCBadge.build_flags}
  -D ADVERT_NAME='"Retia Badge Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
build_src_filter = ${Retia_DCBadge.build_src_filter}
  +<../examples/simple_repeater>
lib_deps =
  ${Retia_DCBadge.lib_deps}
  ${esp32_ota.lib_deps}

[env:Retia_DCBadge_room_server]
extends = Retia_DCBadge
build_flags =
  ${Retia_DCBadge.build_flags}
  -D ADVERT_NAME='"Retia Badge Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'
build_src_filter = ${Retia_DCBadge.build_src_filter}
  +<../examples/simple_room_server>
lib_deps =
  ${Retia_DCBadge.lib_deps}
  ${esp32_ota.lib_deps}
